repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: rustfmt non-vendored files
        entry: scripts/rustfmt-non-vendored --check
        language: system
        pass_filenames: false
        types_or: [rust]
      - id: cargo-clippy
        name: Clippy (deny warnings)
        entry: cargo clippy -- -D warnings
        language: system
        pass_filenames: false
        files: '(\.rs$|(^|/)Cargo\.(toml|lock)$|^\.cargo/config(\.toml)?$)'
