name: Performance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runs:
        description: Measured runs per binary and test (blank uses 50)
      size_mib:
        description: Generated VCD size in MiB
        default: "256"
      baseline_ref:
        description: Git baseline revision (empty uses HEAD^)
        default: ""
      baseline_version:
        description: Optional published baseline version, or latest (overrides Git baseline)
        default: ""

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Discover benchmark shards
        id: shards
        run: echo "matrix=$(python3 tests/performance/run.py --print-shard-matrix)" >> "$GITHUB_OUTPUT"

  compare:
    needs: discover
    name: Performance (${{ matrix.case }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        id: rust
      - uses: Swatinem/rust-cache@v2
      - name: Resolve baseline
        id: baseline
        env:
          BASELINE_VERSION: ${{ inputs.baseline_version }}
          BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          args=()
          if [[ -n "$BASELINE_VERSION" ]]; then
            args+=(--baseline-version "$BASELINE_VERSION")
          elif [[ -n "$BASELINE_REF" ]]; then
            args+=(--baseline-ref "$BASELINE_REF")
          fi
          id=$(python3 tests/performance/run.py --print-baseline-id "${args[@]}")
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: target/performance/baselines
          key: performance-baseline-ubuntu24-${{ runner.arch }}-${{ steps.baseline.outputs.id }}-${{ steps.rust.outputs.cachekey }}-v3
      - name: Compare release performance
        id: comparison
        env:
          NUM_SHARDS: ${{ matrix.num_shards }}
          SHARD: ${{ matrix.shard }}
          RUNS: ${{ inputs.runs || '50' }}
          SIZE_MIB: ${{ inputs.size_mib || '256' }}
          BASELINE_VERSION: ${{ inputs.baseline_version }}
          BASELINE_REF: ${{ steps.baseline.outputs.id }}
        run: |
          args=(--baseline-ref "$BASELINE_REF")
          if [[ -n "$BASELINE_VERSION" ]]; then
            args=(--baseline-version "$BASELINE_REF")
          fi
          python3 tests/performance/run.py "${args[@]}" --runs "$RUNS" --size-mib "$SIZE_MIB" \
            --num-shards "$NUM_SHARDS" --shard "$SHARD"
      - name: Check baseline variability after failure
        if: ${{ failure() && steps.comparison.outcome == 'failure' }}
        env:
          NUM_SHARDS: ${{ matrix.num_shards }}
          SHARD: ${{ matrix.shard }}
          RUNS: ${{ inputs.runs || '50' }}
          SIZE_MIB: ${{ inputs.size_mib || '256' }}
          BASELINE_VERSION: ${{ inputs.baseline_version }}
          BASELINE_REF: ${{ steps.baseline.outputs.id }}
        run: |
          args=(--baseline-ref "$BASELINE_REF")
          if [[ -n "$BASELINE_VERSION" ]]; then
            args=(--baseline-version "$BASELINE_REF")
          fi
          python3 tests/performance/run.py "${args[@]}" --runs "$RUNS" --size-mib "$SIZE_MIB" \
            --num-shards "$NUM_SHARDS" --shard "$SHARD" \
            --baseline-self-check --work-dir target/performance-self-check
      - name: Upload measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-results-${{ matrix.shard }}
          path: |
            target/performance/shard-${{ matrix.shard }}/results.json
            target/performance/shard-${{ matrix.shard }}/*.stderr
            target/performance-self-check/shard-${{ matrix.shard }}/results.json
            target/performance-self-check/shard-${{ matrix.shard }}/*.stderr
          if-no-files-found: ignore
